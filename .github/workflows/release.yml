name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so generated release notes can diff against the previous tag.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag v$tag does not match package.json version $version"
            exit 1
          fi
          echo "releasing $version"
      - name: Check plugin version matches package.json
        run: node scripts/sync-version.mjs --check
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Verify dist is committed
        run: git diff --exit-code -- dist
      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code@2.1.318
      - name: Validate marketplace and plugin
        run: claude plugin validate --strict .
      - name: Build the plugin bundle
        run: npm run build:plugin-zip
      - name: Verify the plugin bundle
        run: |
          rm -rf "$RUNNER_TEMP/plugin-bundle"
          unzip -q dist-plugin/android-ui-inspector-*.zip -d "$RUNNER_TEMP/plugin-bundle"
          # The archive root is the plugin folder, so the same checks that run on
          # the repository must pass on the extracted bundle.
          claude plugin validate --strict "$RUNNER_TEMP/plugin-bundle"
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists"
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
          fi
      - name: Attach the plugin bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist-plugin/android-ui-inspector-*.zip --clobber
